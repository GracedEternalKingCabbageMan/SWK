[package]
name = "lwk_wollet"
version = "0.18.1"
edition = "2021"
autotests = false
description = "Liquid Wallet Kit - Watch-only wallet based on CT Descriptors"
exclude = ["tests/", "benches/"]
license = "MIT OR BSD-2-Clause"
documentation = "https://docs.rs/lwk_wollet"

[lib]
crate-type = ["lib"]

[dependencies]
lwk_common = { version = "0.18.1" }
lwk_signer = { version = "0.18.1", features = [
    "jade",
    "ledger",
], optional = true }

rand = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
aes-gcm-siv = "0.11.0"
electrum-client = { version = "0.21.0", optional = true, default-features = false, features = [
    "use-rustls-ring",
    "proxy",
] }
bip39 = "2.0.0"
elements-miniscript.workspace = true
thiserror = { workspace = true }
once_cell = "1.18.0"
elements.workspace = true
# TODO: remove once we have elements-miniscript compatible with elements 0.26
elements26 = { package = "elements", version = "0.26.2", features = ["base64"] }
base64 = "0.21.4"
bitcoincore-rpc = { version = "0.19.0", optional = true }
futures = "0.3"
# SEQUENTIA dual-chain (feature `btc`): the Bitcoin parent-chain crate, pinned in
# the workspace to the exact transitive elements-miniscript version. Optional so
# bitcoin stays purely transitive when `btc` is off; using it directly under the
# feature lets the kit build/sign Bitcoin txs. Code uses the existing re-export
# `crate::bitcoin`, which unifies to this same crate.
bitcoin = { workspace = true, optional = true }

reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "blocking",
    "json",
    "rustls-tls",
] }

scrypt = { version = "0.11.0", optional = true }
pbkdf2 = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true, features = ["alloc"] }
aes-gcm = { version = "0.10", optional = true }
flate2 = { version = "1.1", optional = true }
rmpv = { version = "1.3", optional = true, features = ["with-serde"] }
rmp-serde = { version = "1.3", optional = true }


#registry
idna = "1"
regex-lite = "0.1.5"

log.workspace = true
fxhash = "0.2.1"

age = { version = "0.11.0", optional = true }
url = "2.5.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

tokio-tungstenite = { version = "0.26.0", optional = true, features = [
    "rustls-tls-webpki-roots",
] }

tokio = { version = "1.36.0", default-features = false, features = [
    "time",
    "rt",
    "macros",
    "rt-multi-thread",
    "sync",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.36.0", default-features = false, features = [
    "time",
    "rt",
    "macros",
] }
# wasm
wasm-bindgen-futures = { version = "0.4.41" }
web-sys = { version = "0.3.68", features = ["Window"] }
js-sys = { version = "0.3.68" }

[dev-dependencies]
lwk_jade = { version = "0.18.1", features = ["test_emulator"] }
lwk_ledger = { version = "0.18.1", features = ["test_emulator"] }
lwk_signer = { version = "0.18.1", features = ["jade", "ledger"] }
lwk_containers = { version = "0.18.1" }
lwk_test_util = { version = "0.18.0" }
lwk_common = { version = "0.18.1", features = ["sqlite"]}

tempfile.workspace = true
zmq = "0.10.0"

criterion = "0.5.1"

[features]
default = [
    "esplora",
    "electrum",
    "elements_rpc",
    "amp2",
    "amp0",
    "prices",
    "registry",
]
serial = ["lwk_jade/serial"] # this is a dev-dep feature
esplora = ["reqwest", "age"]
electrum = ["electrum-client"]
elements_rpc = ["bitcoincore-rpc"]
bindings = []
test_wallet = ["lwk_signer"]
# Sequentia: treat explicit (non-confidential) outputs as first-class wallet
# funds (balance, coin selection, history). Requires elements' sequentia feature.
sequentia = ["elements/sequentia"]
# SEQUENTIA dual-chain: bring the Bitcoin parent-chain wallet + HTLC leg into the
# kit, so every standard Sequentia wallet is Bitcoin + Sequentia. `btc` is the
# I/O-free core (keys, address model, tx build/sign, redeemScript); the esplora
# transport is split so wasm uses async and Ambra uses blocking. `btc-blocking`
# must NEVER be unified into a wasm build (reqwest::blocking is absent there); a
# compile_error! guard in the module enforces that.
# `btc` implies `sequentia`: the HTLC redeemScript has ONE source — the SEQ-leg
# builder (seqdex_htlc, sequentia-gated) — which the BTC leg wraps, so the legs
# stay byte-identical. A dual-chain kit is always Sequentia anyway.
btc = ["bitcoin", "sequentia"]
# `age` seals the cross-chain swap state at rest (the non-HD secret must never hit
# disk unencrypted); it rides only on `esplora` otherwise, so the btc transports
# pull it explicitly. Both transports derive the parent-chain keychain directly
# (bip39 + bitcoin::bip32, byte-identical to SwSigner), so neither pulls lwk_signer
# — keeping the wasm (btc-async) build free of lwk_wollet's jade/ledger signer dep.
btc-async = ["btc", "reqwest", "age"]
btc-blocking = ["btc", "reqwest", "age"]
amp2 = ["reqwest"]
amp0 = [
    "tokio-tungstenite",
    "reqwest",
    "scrypt",
    "pbkdf2",
    "sha2",
    "hmac",
    "aes",
    "cbc",
    "aes-gcm",
    "flate2",
    "rmpv",
    "rmp-serde",
]
prices = ["reqwest"]
registry = ["reqwest"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[example]]
name = "list_transactions"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "benches"
harness = false
